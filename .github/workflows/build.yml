name: build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  jvm:
    name: JVM modules (no Android SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Named module by module on purpose. A bare `./gradlew test` would resolve
      # :app:testDebugUnitTest and need an SDK; listing the JVM modules keeps
      # this job proving what it claims — that the engine, the Room layer
      # included, builds and passes with no Android SDK anywhere.
      - name: Test the JVM modules
        run: |
          ./gradlew --stacktrace \
            :core:model:test \
            :core:database:test \
            :core:hashing:test \
            :core:storage:test \
            :core:transfer:test \
            :providers:api:test \
            :providers:fake:test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jvm
          path: "**/build/reports/tests/**"

  android:
    name: Android modules (:app and feature/*)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # `packages` is set explicitly because the action's default list still
      # contains the obsolete `tools` package, which no longer exists in the SDK
      # repository — sdkmanager exits 1 with "Failed to find package 'tools'"
      # before Gradle runs at all. Naming what the build actually needs also
      # pins the platform rather than relying on the runner image.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` rather than `assembleDebug`: it compiles every module, runs the
      # JVM tests and lints the Android ones, which is the acceptance criterion
      # for §33 v0.2.
      - name: Build everything
        run: ./gradlew build --stacktrace

      # The committed Room schema must match what the annotations generate. A
      # dirty tree here means someone changed an entity without exporting the
      # schema, which is exactly the review-time signal exportSchema is for.
      - name: Check the exported Room schema is committed
        run: |
          if [ -n "$(git status --porcelain core/database/schemas)" ]; then
            echo "The exported Room schema differs from the committed one:"
            git --no-pager diff -- core/database/schemas
            exit 1
          fi

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-android
          path: "**/build/reports/**"

  instrumented:
    name: Emulator smoke test (:app on a device)
    runs-on: ubuntu-latest
    # The one class of bug the other two jobs structurally cannot catch: a JVM
    # module naming a platform-specific API. v0.2 was green on both and still
    # died on launch — see docs/decisions.md ADR-0025.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner exposes KVM only after this; without it the emulator falls
      # back to software rendering and the job takes long enough to be useless.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 rather than 36: it is the oldest API level that still
          # exercises the UIDT path §17 targets, and its system images are the
          # best-seeded on CI. minSdk 26 coverage belongs with the §31.4
          # recovery work in v0.5.
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumentation reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-instrumented
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
