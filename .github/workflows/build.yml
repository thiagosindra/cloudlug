name: build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  jvm:
    name: JVM modules (no Android SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Named module by module on purpose. A bare `./gradlew test` would resolve
      # :app:testDebugUnitTest and need an SDK; listing the JVM modules keeps
      # this job proving what it claims — that the engine, the Room layer
      # included, builds and passes with no Android SDK anywhere.
      #
      # A module added and not listed here is silently exempt from that claim,
      # which is how :core:network and :providers:dropbox came to be proven
      # only by the job that does have an SDK. The whole Dropbox adapter is
      # pure Kotlin and belongs here.
      #
      # :providers:dropbox's live tests skip without DROPBOX_REFRESH_TOKEN,
      # which this job does not set and must not: CI stays hermetic and a fork
      # with no secret goes green.
      - name: Test the JVM modules
        run: |
          ./gradlew --stacktrace \
            :core:model:test \
            :core:database:test \
            :core:hashing:test \
            :core:storage:test \
            :core:transfer:test \
            :providers:api:test \
            :providers:fake:test \
            :core:network:test \
            :providers:dropbox:test \
            :tools:dropbox-hash-check:test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jvm
          path: "**/build/reports/tests/**"

  android:
    name: Android modules (:app and feature/*)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # `packages` is set explicitly because the action's default list still
      # contains the obsolete `tools` package, which no longer exists in the SDK
      # repository — sdkmanager exits 1 with "Failed to find package 'tools'"
      # before Gradle runs at all. Naming what the build actually needs also
      # pins the platform rather than relying on the runner image.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` rather than `assembleDebug`: it compiles every module, runs the
      # JVM tests and lints the Android ones, which is the acceptance criterion
      # for §33 v0.2.
      - name: Build everything
        run: ./gradlew build --stacktrace

      # The committed Room schema must match what the annotations generate. A
      # dirty tree here means someone changed an entity without exporting the
      # schema, which is exactly the review-time signal exportSchema is for.
      - name: Check the exported Room schema is committed
        run: |
          if [ -n "$(git status --porcelain core/database/schemas)" ]; then
            echo "The exported Room schema differs from the committed one:"
            git --no-pager diff -- core/database/schemas
            exit 1
          fi

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-android
          path: "**/build/reports/**"

  instrumented:
    name: Emulator smoke test (:app on a device)
    runs-on: ubuntu-latest
    # The one class of bug the other two jobs structurally cannot catch: a JVM
    # module naming a platform-specific API. v0.2 was green on both and still
    # died on launch — see docs/decisions.md ADR-0025.
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner exposes KVM only after this; without it the emulator falls
      # back to software rendering and the job takes long enough to be useless.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Anything that stops the emulator process from starting looks identical
      # downstream: the device never registers, and the action polls a dead
      # port until it times out. These two steps assert the preconditions up
      # front so a failure names itself instead of having to be inferred.
      - name: Require hardware acceleration
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::No /dev/kvm on this runner. The x86_64 emulator cannot start."
            exit 1
          fi
          ls -l /dev/kvm

      # The real cause of four consecutive "Timeout waiting for emulator to
      # boot" failures, which the emulator states plainly and the action then
      # swallows:
      #
      #   FATAL | Not enough space to create userdata partition.
      #           Available: 7131.55 MB, need 7372.80 MB.
      #
      # 241 MB short. The runner ships toolchains this build never touches —
      # CloudLug is pure Kotlin with no native code, so the NDK alone is dead
      # weight. Dropping them buys headroom well beyond the shortfall.
      - name: Free disk space for the AVD
        run: |
          df -h --output=avail / | tail -1 | xargs echo "Available before:"
          sudo rm -rf \
            /usr/local/lib/android/sdk/ndk \
            /usr/share/dotnet \
            /usr/share/swift \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL
          df -h --output=avail / | tail -1 | xargs echo "Available after:"
          avail=$(df -m --output=avail /home/runner | tail -1 | tr -d ' ')
          if [ "$avail" -lt 12000 ]; then
            echo "::error::Only ${avail} MB free; the AVD needs ~7.4 GB plus build output."
            exit 1
          fi

      - name: Run the instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # `default`, not `google_apis`: CloudLug uses no Play services at all
          # — §3 names none and §27 rules out the analytics they usually carry —
          # so the Play image only adds boot time to a test that launches one
          # activity. API 30 for the same reason: this test asserts the app
          # starts and Room opens, which every supported API does identically,
          # and the §17 UIDT behaviour that would justify 34+ is v0.5 work with
          # its own §31.4 scenarios. Earlier runs chose 34/google_apis on my
          # reasoning about what to cover rather than what this test needs, and
          # the emulator timed out three times without booting.
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Three suites, because each needs a device for a different reason.
          # :app is the §31.3 journey. :core:security, because §8.3's
          # guarantees are about Android Keystore and Keystore exists only on
          # a device — a JVM test there could only exercise a fake, which
          # would verify nothing. :tools:recovery-test is the §31.4 harness:
          # it force-stops CloudLug and survives it, which a test living
          # inside CloudLug's own process cannot do. That module declares its
          # own dependency on :app:installDebug, because it instruments
          # itself and so would otherwise install only its own two APKs.
          # No --stacktrace. On a test failure Gradle prints ~140 lines of
          # its own executor internals, which pushes the instrumentation's
          # actual message out of any readable tail of the log — two spike
          # runs were spent unable to see why a single assertion failed. The
          # step below prints the result XML instead, which is the part that
          # says something.
          # --continue: the three suites are independent, and booting an
          # emulator costs eight minutes. Without it the first failure hides
          # whatever the other two would have said, which on the run that
          # added :tools:recovery-test meant learning nothing at all about the
          # two scenarios it exists for.
          script: ./gradlew --continue :app:connectedDebugAndroidTest :core:security:connectedDebugAndroidTest :tools:recovery-test:connectedDebugAndroidTest

      - name: Print the instrumentation results
        if: failure()
        run: |
          # The one thing worth reading when a device test fails.
          find . -path '*androidTest-results*' -name '*.xml' -print -exec cat {} \; | head -200
          find . -path '*androidTests/connected*' -name '*.txt' -print -exec cat {} \; | head -100

      - name: Upload instrumentation reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-instrumented
          path: |
            tools/recovery-test/build/reports/androidTests/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            core/security/build/reports/androidTests/**
            core/security/build/outputs/androidTest-results/**
