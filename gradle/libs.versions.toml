# Version catalog for CloudLug.
#
# v0.2 adds the Android half of the stack from spec §3: AGP, Room, Hilt and
# Compose. OkHttp and AppAuth arrive with the first real adapter in v0.3 — see
# docs/decisions.md. ExifInterface is still unused.

[versions]
kotlin = "2.2.20"
ksp = "2.2.20-2.0.4"
coroutines = "1.10.2"
serialization = "1.8.1"
okhttp = "4.12.0"
# AppAuth 0.11.1 is the current release. CloudLug drives only its browser leg
# (§8.1's Custom Tab and the redirect back); the PKCE values and the token
# exchange are CloudLug's own, so the verifier logic the app runs is the
# logic tools/dropbox-auth has already run by hand.
appauth = "0.11.1"
junit = "5.11.4"
junitPlatform = "1.11.4"

agp = "8.13.2"
# The androidx versions below are the newest that still compile against SDK 36.
# Anything later declares a compileSdk 37 floor in its AAR metadata, which AGP
# 8.13 refuses — see docs/decisions.md ADR-0023.
compileSdk = "36"
minSdk = "26"
targetSdk = "36"

room = "2.8.5"
# Room 2.8.5 resolves androidx.sqlite 2.6.2. The app uses the framework driver
# (the platform's own SQLite); the JVM tests use the bundled one, which is the
# only way to run Room off-device — ADR-0021 as revised, ADR-0025.
sqlite = "2.6.2"
hilt = "2.57.2"
hiltNavigation = "1.2.0"
composeBom = "2025.06.01"
activityCompose = "1.12.0"
navigationCompose = "2.9.5"
lifecycle = "2.9.1"
coreKtx = "1.16.0"
# Only AppAuth needs this. Its redirect receiver is an AppCompatActivity, so
# that one activity must run under a Theme.AppCompat descendant; nothing else
# in CloudLug is an AppCompat view (§3 is Compose throughout).
appcompat = "1.7.1"
androidxTest = "1.6.2"
androidxTestCore = "1.6.1"
androidxTestJunit = "1.2.1"
# §17 background execution: WorkManager for API 26-33, and the Hilt
# bridge that lets a worker be constructed by the graph.
work = "2.10.0"
androidxHilt = "1.2.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
appauth = { module = "net.openid:appauth", version.ref = "appauth" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
sqlite-framework = { module = "androidx.sqlite:sqlite-framework", version.ref = "sqlite" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigation" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
# Named androidx-* rather than hilt-* so the alias does not collide with
# `hilt-compiler`, which a catalog cannot have as both a leaf and a group.
androidx-hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "androidxHilt" }
androidx-hilt-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "androidxHilt" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
