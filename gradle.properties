org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Android (v0.2). AndroidX is required by every library in spec §3.
android.useAndroidX=true
# Only the resources a module actually declares end up in its R class, which
# keeps :app's R small and makes an accidental cross-module resource reference a
# compile error rather than a silent success.
android.nonTransitiveRClass=true
